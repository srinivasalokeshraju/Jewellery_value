name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install lint tooling
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
        working-directory: server

      - name: Server tests
        run: npm test
        working-directory: server

      - name: Plugin checker tests
        run: node --test plugin/test/*.test.mjs

      - name: Validate plugin for the directory
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.325 plugin validate . --strict
          npx --yes @anthropic-ai/claude-code@2.1.325 plugin validate ./plugin --profile directory
